<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cursos</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #f3f4f6;
            padding: 40px 20px;
        }

        .cabecalho {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            margin: 0 auto 30px auto;
        }

        .logo {
            color: #4f46e5;
            font-size: 2rem;
            font-weight: bold;
        }

        .botoes-nav {
            display: flex;
            gap: 10px;
        }

        .btn-nav {
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            color: white;
        }

        .btn-perfil {
            background-color: #374151;
        }

        .btn-perfil:hover {
            background-color: #1f2937;
        }

        .btn-sair {
            background-color: #ef4444;
        }

        .btn-sair:hover {
            background-color: #dc2626;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 900px;
            margin: 0 auto;
        }

        h2 {
            color: #1f2937;
            margin-bottom: 20px;
        }

        #lista-cursos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card-curso {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-curso:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.05);
        }

        .card-curso h3 {
            color: #4f46e5;
            margin-bottom: 10px;
            font-size: 1.25rem;
        }

        .card-curso p {
            color: #6b7280;
            line-height: 1.5;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .btn-inscrever {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.2s;
        }

        .btn-inscrever:hover {
            background-color: #059669;
        }

        .progresso-container {
            background-color: #e5e7eb;
            border-radius: 6px;
            overflow: hidden;
            width: 100%;
            height: 20px;
            margin-top: auto;
            position: relative;
        }

        .progresso-barra {
            background-color: #4f46e5;
            height: 100%;
            transition: width 0.3s;
        }

        .progresso-texto {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 0;
            left: 0;
            font-size: 0.8rem;
            font-weight: bold;
            line-height: 20px;
            color: #1f2937;
        }
    </style>
</head>
<body>

    <div class="cabecalho">
        <div class="logo">Plataforma de Cursos</div>
        <div class="botoes-nav">
            <button class="btn-nav btn-perfil" onclick="irParaPerfil()">Meu Perfil</button>
            <button class="btn-nav btn-sair" onclick="fazerLogout()">Sair</button>
        </div>
    </div>

    <div class="container">
        <h2>Cursos Disponíveis</h2>
        <div id="lista-cursos">Carregando cursos...</div>
    </div>

    <script>
        const usuarioId = localStorage.getItem('usuarioLogadoId');

        window.onload = () => {
            if(!usuarioId) {
                window.location.href = 'login.html';
                return;
            }
            carregarCursos();
        };

        async function carregarCursos() {
            try {
                const resCursos = await fetch('http://localhost:3000/cursos');
                const cursos = await resCursos.json();

                const resInscricoes = await fetch(`http://localhost:3000/inscricoes/${usuarioId}`);
                const inscricoes = await resInscricoes.json();

                const divLista = document.getElementById('lista-cursos');
                
                if (cursos.length === 0) {
                    divLista.innerHTML = "<p>Nenhum curso cadastrado.</p>";
                    return;
                }

                divLista.innerHTML = cursos.map(curso => {
                    const inscricaoEncontrada = inscricoes.find(i => i.curso_id === curso.id);

                    let areaAcao = '';
                    if (inscricaoEncontrada) {
                        areaAcao = `
                            <div class="progresso-container" title="Seu progresso neste curso">
                                <div class="progresso-barra" style="width: ${inscricaoEncontrada.progresso}%;"></div>
                                <div class="progresso-texto">${inscricaoEncontrada.progresso}% Concluído</div>
                            </div>
                        `;
                    } else {
                        areaAcao = `<button class="btn-inscrever" onclick="inscrever(${curso.id})">Inscrever-se</button>`;
                    }

                    return `
                        <div class="card-curso">
                            <div>
                                <h3>${curso.titulo}</h3>
                                <p>${curso.descricao}</p>
                            </div>
                            ${areaAcao}
                        </div>
                    `;
                }).join('');

            } catch (error) {
                document.getElementById('lista-cursos').innerHTML = "<p>Erro ao conectar com o servidor.</p>";
            }
        }

        async function inscrever(cursoId) {
            try {
                const res = await fetch('http://localhost:3000/inscricoes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario_id: usuarioId, curso_id: cursoId })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    alert(data.mensagem);
                    carregarCursos(); 
                } else {
                    alert(data.erro);
                }
            } catch (error) {
                alert("Erro ao tentar se inscrever.");
            }
        }

        function irParaPerfil() {
            window.location.href = 'perfil.html';
        }

        async function fazerLogout() {
            try {
                await fetch('http://localhost:3000/logout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario_id: usuarioId })
                });
            } catch (error) {
                console.error("Erro ao registrar log de saída");
            }
            
            localStorage.removeItem('usuarioLogadoId');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
